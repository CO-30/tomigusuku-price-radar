# 対象店舗レジストリ。
# source.type:
#   auto   - 公式公開ソースを robots.txt 判定の上で自動取得（url 必須）
#   manual - 自動取得不可（robots/規約/Bot拒否を確認済み）。inbox/<id>/ への
#            手動投入（チラシ撮影・スクショ）で補完する。
# 2026-11-19 調査: 県内主要チェーンのWebチラシはトクバイ集約だが、トクバイは
# AIクローラー全面拒否、各社公式もBot拒否のため manual 開始。probe ワークフローで
# 定期的に再調査し、許可されたソースが見つかり次第 auto に昇格する。

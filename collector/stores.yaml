# 対象店舗レジストリ。
# source.type:
#   auto   - 公式公開ソースを robots.txt 判定の上で自動取得（url 必須）
#   manual - 自動取得不可（robots/規約/Bot拒否を確認済み）。inbox/<id>/ への
#            手動投入（チラシ撮影・スクショ）で補完する。
# 2026-11-19 調査(確定): 県内主要チェーンのWebチラシは例外なくトクバイ集約で、
# トクバイは robots.txt で ClaudeBot/anthropic-ai/Claude-Web を Disallow: / 全面拒否。
# イオン琉球公式(www.aeon-ryukyu.jp)は robots 上は取得可だが、チラシ実体を持たず
# widgets.tokubai.co.jp を埋め込むだけ(例: つかざん店=トクバイ店舗ID 124230)。
# 業務スーパー・ドンキ公式も robots 拒否。= 規約を守る限り自動収集できるソースは現状ゼロ。
# よって全店 manual。データ源はアプリ内の撮影/スクショ取込と inbox 手動投入。
# flyer_url は「人が開いてスクショする」ための導線なので、イオン系は公式店舗ページの
# #webpaper を指す(一次情報・店舗別・URLが安定)。probe/explore で定期的に再調査する。

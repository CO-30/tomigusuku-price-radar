# 毎朝の自動更新。JST 05:30 に本実行、06:30 に再試行（当日成功済みならスキップ）。
# 07:00 (JST) までに GitHub Pages のランキングが最新化される。
name: daily-update

on:
  schedule:
    - cron: "30 20 * * *"   # 05:30 JST
    - cron: "30 21 * * *"   # 06:30 JST (リトライ)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.guard.outputs.ran }}
    steps:
      - uses: actions/checkout@v4

      - name: 当日成功済みならスキップ（リトライ枠用ガード）
        id: guard
        run: |
          TODAY=$(TZ=Asia/Tokyo date +%F)
          if [ -f data/last_success ] && [ "$(cat data/last_success)" = "$TODAY" ]; then
            echo "already succeeded today ($TODAY)"
            echo "ran=false" >> "$GITHUB_OUTPUT"
          else
            echo "ran=true" >> "$GITHUB_OUTPUT"
          fi

      - name: OCR環境セットアップ
        if: steps.guard.outputs.ran == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-jpn poppler-utils

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.ran == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Python依存関係
        if: steps.guard.outputs.ran == 'true'
        run: pip install -r requirements.txt

      - name: パイプライン実行（収集→OCR→単価→エクスポート）
        if: steps.guard.outputs.ran == 'true'
        id: run
        run: |
          set +e
          python pipeline.py
          CODE=$?
          set -e
          if [ "$CODE" = "0" ]; then
            TZ=Asia/Tokyo date +%F > data/last_success
          fi
          exit $CODE

      - name: データをコミット（失敗時も取得ログは保存）
        if: always() && steps.guard.outputs.ran == 'true'
        run: |
          git config user.name "price-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase origin main
          git add data/
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Tokyo date '+%F %R') 自動更新"
          git push

      - name: フロントエンドにデータ同期
        if: steps.guard.outputs.ran == 'true'
        run: |
          mkdir -p frontend/public/data
          cp -r data/public/. frontend/public/data/
          if [ -d data/flyers ]; then
            mkdir -p frontend/public/data/flyers
            cp -r data/flyers/. frontend/public/data/flyers/
          fi
          # flyer_image のパス (data/flyers/...) を data/ 配下の実配置に合わせる
          # JSON側は data/flyers/... のまま → public/data/flyers に置いたので
          # BASE_URL + "data/flyers/..." で解決される

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ran == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: フロントエンドをビルド
        if: steps.guard.outputs.ran == 'true'
        run: |
          cd frontend
          npm ci
          npm run build

      # Pages サイトが未作成の場合の自動有効化を試みる。組織リポジトリでは
      # GITHUB_TOKEN に権限がなく失敗することがあるため、失敗してもジョブは
      # 止めない（その場合は Settings → Pages → Source: GitHub Actions を一度
      # 手動で設定する）。
      - uses: actions/configure-pages@v5
        if: steps.guard.outputs.ran == 'true'
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: steps.guard.outputs.ran == 'true'
        with:
          path: frontend/dist

  deploy:
    needs: pipeline
    if: needs.pipeline.outputs.ran == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
